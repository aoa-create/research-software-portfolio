name: oxygen-plasma-tests

on:
  push:
    branches: [main]
    paths:
      - 'projects/oxygen-plasma-system/**'
      - '.github/workflows/oxygen-plasma-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/oxygen-plasma-system/**'
      - '.github/workflows/oxygen-plasma-tests.yml'

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/oxygen-plasma-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Import GUI module
        run: python -c "from pymodaq_plugins_oxygen_plasma.app.main import OxygenPlasmaMainWindow; print(OxygenPlasmaMainWindow.__name__)"
